stat.flux-free-text = Up to 11 different ingredients (items AND liquids) at once - any number from 1 to 11. Each ingredient claims an input slot when it first arrives; the per-slot amount sets the mixing ratio. The composition determines the new material's properties, projectile behaviour and how stable the reaction is.
