block.flux-protocol-flux-cooler.name = Fuser Coolant Jacket
block.flux-protocol-flux-cooler.description = Dedicated cooling for the Flux Fuser. Place it directly against a Flux Fuser and feed it water or cryofluid by conduit. Cools exactly ONE adjacent fuser (the one with the lowest position; shown in its menu), only draws coolant while that fuser is warm, and at most 4 jackets count per fuser. Does not affect any other building; generator cooling is unchanged.
block.flux-protocol-flux-cooler-erekir.name = Fuser Coolant Jacket
block.flux-protocol-flux-cooler-erekir.description = Dedicated cooling for the Flux Fuser. Place it directly against a Flux Fuser and feed it water or cryofluid by conduit. Cools exactly ONE adjacent fuser, only draws coolant while that fuser is warm, and at most 4 jackets count per fuser.
stat.cooler-text = Cools one adjacent Flux Fuser. Only real, non-flammable coolants work; usage is proportional to the heat that has to be removed. Water and cryofluid stay valid synthesis ingredients - the jacket is a separate system with its own coolant feed.
