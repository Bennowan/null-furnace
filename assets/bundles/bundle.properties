block.flux-protocol-flux-node.name = Flux Node (Distributor)
block.flux-protocol-flux-node.description = DISTRIBUTES flux, produces none. Links converters (flux producers) with consumers such as the Skillable Turret. Placing it auto-links everything in range; tap a building while the node is selected to link/unlink it.
block.flux-protocol-flux-stabilizer.name = Flux Stabilizer (Producer)
block.flux-protocol-flux-stabilizer.description = PRODUCES flux from normal power. Reliable and efficient, low instability. Needs power on its side and a Flux Node link. Stores no flux.
block.flux-protocol-flux-accelerator.name = Flux Accelerator (Producer)
block.flux-protocol-flux-accelerator.description = PRODUCES flux from normal power. Higher throughput, but instability builds up much faster. Needs power and a Flux Node link.
block.flux-protocol-flux-quantum.name = Quantum Converter (Producer)
block.flux-protocol-flux-quantum.description = PRODUCES flux from normal power. High-end throughput, expensive and risky. Needs power and a Flux Node link.
block.flux-protocol-skillable-turret.name = Skillable Turret
block.flux-protocol-skillable-turret.description = CONSUMES flux (best) or - weaker - normal power, never both at once. One material slot picks the mode. Flux: full range, rate and damage. Normal power: needs a huge amount of power for only about 30% rate, 60% range and 45% damage; the three high-end modes need flux. Build: power -> Flux Converter -> Flux Node -> Turret.
