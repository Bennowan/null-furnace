block.flux-protocol-flux-fuser.name = Flux Fuser (Synthesizer)
block.flux-protocol-flux-fuser-erekir.name = Flux Fuser (Synthesizer)
block.flux-protocol-flux-fuser.description = Free-form synthesis: up to 11 different ingredients (solid items by conveyor, liquids by conduit) plus the flux available RIGHT NOW produce a new, unique material whose properties are calculated from composition and mixing ratio. Set the amount per slot in the menu. The product leaves through an adjacent conveyor (e.g. to the Skillable Turret). Dangerous mixtures can run away and explode - the preview shows the stability. The four original recipes remain available as Classic mode.
block.flux-protocol-flux-fuser-erekir.description = Free-form synthesis: up to 11 different ingredients (solid items by conveyor, liquids by conduit) plus the flux available RIGHT NOW produce a new, unique material whose properties are calculated from composition and mixing ratio. Set the amount per slot in the menu. The product leaves through an adjacent conveyor (e.g. to the Skillable Turret). Dangerous mixtures can run away and explode - the preview shows the stability. The four original recipes remain available as Classic mode.
item.flux-protocol-carbon-conductor.name = Carbon Conductor
item.flux-protocol-carbon-conductor.description = Bundled carbon rods wound with copper. Extremely conductive. Turret ammo: fast shots with strong chain lightning.
item.flux-protocol-ferrite-composite.name = Ferrite Composite
item.flux-protocol-ferrite-composite.description = Layered ferrite plates bound with oil. Dense and tough. Turret ammo: heavy armor-piercing slugs that burst into shrapnel.
item.flux-protocol-synaptic-alloy.name = Synaptic Alloy
item.flux-protocol-synaptic-alloy.description = A supercooled lattice that reacts to signals. Turret ammo: swarm missiles that track targets and release mini-missiles in flight.
item.flux-protocol-pyroglass.name = Pyroglass
item.flux-protocol-pyroglass.description = Glass fused in molten slag, glowing from within. Turret ammo: shells that shatter into piercing, burning shards.
