fuser.hint.prepare = Zutaten und Mengen in Ruhe einrichten - nichts startet von selbst. Den automatischen Betrieb einschalten, wenn die Mischung steht.
fuser.hint.settling = Die Mischung wurde gerade verändert. Start in {0} s, wenn sich nichts mehr ändert.
fuser.hint.cooldown = Zu heiß für diese Mischung ({0}% Temperatur). Wartet auf Abkühlung.
