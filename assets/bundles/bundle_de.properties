block.flux-protocol-flux-fuser.name = Flux-Fuser (Synthese)
block.flux-protocol-flux-fuser-erekir.name = Flux-Fuser (Synthese)
block.flux-protocol-flux-fuser.description = Frei kombinierbare Synthese: bis zu 11 verschiedene Zutaten (feste Items per Förderband, Flüssigkeiten per Leitung) plus der JETZT verfügbare Flux ergeben ein neues, einzigartiges Material, dessen Eigenschaften aus Zusammensetzung und Mengenverhältnis berechnet werden. Mengen je Platz im Menü einstellen. Das Produkt verlässt ihn über ein angrenzendes Förderband (z. B. zum Skillable Turret). Gefährliche Mischungen können durchgehen und explodieren - die Vorschau zeigt die Stabilität. Die vier alten Rezepte gibt es weiter als Klassik-Modus.
block.flux-protocol-flux-fuser-erekir.description = Frei kombinierbare Synthese: bis zu 11 verschiedene Zutaten (feste Items per Förderband, Flüssigkeiten per Leitung) plus der JETZT verfügbare Flux ergeben ein neues, einzigartiges Material, dessen Eigenschaften aus Zusammensetzung und Mengenverhältnis berechnet werden. Mengen je Platz im Menü einstellen. Das Produkt verlässt ihn über ein angrenzendes Förderband (z. B. zum Skillable Turret). Gefährliche Mischungen können durchgehen und explodieren - die Vorschau zeigt die Stabilität. Die vier alten Rezepte gibt es weiter als Klassik-Modus.
item.flux-protocol-carbon-conductor.name = Carbon Conductor
item.flux-protocol-carbon-conductor.description = Gebündelte Kohlenstoffstäbe, kupferumwickelt. Extrem leitfähig. Turm-Munition: schnelle Schüsse mit starken Kettenblitzen.
item.flux-protocol-ferrite-composite.name = Ferrite Composite
item.flux-protocol-ferrite-composite.description = Geschichtete Ferritplatten, mit Öl gebunden. Dicht und zäh. Turm-Munition: schwere Panzerbrecher, die in Splitter zerplatzen.
item.flux-protocol-synaptic-alloy.name = Synaptic Alloy
item.flux-protocol-synaptic-alloy.description = Ein unterkühltes Gitter, das auf Signale reagiert. Turm-Munition: Schwarmraketen, die Ziele verfolgen und im Flug Mini-Raketen abgeben.
item.flux-protocol-pyroglass.name = Pyroglass
item.flux-protocol-pyroglass.description = In flüssiger Schlacke verschmolzenes, von innen glühendes Glas. Turm-Munition: Geschosse, die in durchschlagende, brennende Scherben zerspringen.
