# --- Freie Materialsynthese (Phase 1) ---
stat.flux-free-synthesis = Freie Synthese
stat.flux-free-text = Bis zu 11 verschiedene Zutaten (Items UND Flüssigkeiten) gleichzeitig - beliebig viele von 1 bis 11. Jede Zutat belegt beim ersten Eintreffen einen Eingangsplatz; die Menge je Platz bestimmt das Mischungsverhältnis. Die Zusammensetzung legt Eigenschaften, Geschossverhalten und die Stabilität der Reaktion des neuen Materials fest.
