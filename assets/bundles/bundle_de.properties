# --- Kuehlung, Vorbereiten/Betrieb (0.5.0) ---
block.flux-protocol-flux-cooler.name = Fuser-Kühlmantel
block.flux-protocol-flux-cooler.description = Eigene Kühlung für den Flux Fuser. Direkt an einen Flux Fuser setzen und per Leitung mit Wasser oder Kryoflüssigkeit versorgen. Kühlt genau EINEN angrenzenden Fuser (den mit der niedrigsten Position; im Menü angezeigt), verbraucht Kühlmittel nur, solange dieser Fuser warm ist, und pro Fuser zählen höchstens 4 Kühlmäntel. Beeinflusst kein anderes Gebäude; die Kühlung von Generatoren bleibt unverändert.
block.flux-protocol-flux-cooler-erekir.name = Fuser-Kühlmantel
block.flux-protocol-flux-cooler-erekir.description = Eigene Kühlung für den Flux Fuser. Direkt an einen Flux Fuser setzen und per Leitung mit Wasser oder Kryoflüssigkeit versorgen. Kühlt genau EINEN angrenzenden Fuser, verbraucht Kühlmittel nur, solange er warm ist, und pro Fuser zählen höchstens 4 Kühlmäntel.
stat.cooler-text = Kühlt einen angrenzenden Flux Fuser. Nur echte, nicht brennbare Kühlmittel wirken; der Verbrauch folgt der abzuführenden Wärme. Wasser und Kryoflüssigkeit bleiben gültige Synthesezutaten - der Kühlmantel ist ein getrenntes System mit eigener Kühlmittelzufuhr.
stat.cooler-limit = Pro Fuser zählen höchstens {0} Kühlmäntel; die Gesamtkühlung ist auf {1} %/s begrenzt.
