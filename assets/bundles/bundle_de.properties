fuser.hint.waitflux = Mischung komplett, wartet auf genug Flux im Netz.
fuser.next.prep = Die nächste Mischung kann schon vorbereitet werden; die laufende Charge ist gesperrt.
fuser.arm = Automatischer Betrieb
fuser.arm.tip = Aus: in Ruhe vorbereiten, nichts startet von selbst. Ein: jede vollständige Mischung wird automatisch verarbeitet (nach kurzer Ruhezeit und nur, wenn der Fuser kühl ist und Flux anliegt). Nach einem Überhitzungsunfall schaltet er sich wieder aus.
fuser.hint.risky = Riskante Mischung: sie startet nie automatisch. 'Jetzt starten' bestätigt das Risiko (nur bei kaltem Fuser möglich); alternativ verdünnen oder kühlen.
