block.flux-protocol-flux-node.name = Flux-Node (Verteiler)
block.flux-protocol-flux-node.description = VERTEILT Flux, erzeugt keinen. Verbindet Konverter (Flux-Erzeuger) mit Verbrauchern wie dem Skillable Turret. Beim Platzieren verbindet er alles in Reichweite automatisch; bei ausgewähltem Node ein Gebäude antippen, um es zu verbinden oder zu trennen.
block.flux-protocol-flux-stabilizer.name = Flux-Stabilisator (Erzeuger)
block.flux-protocol-flux-stabilizer.description = ERZEUGT Flux aus normalem Strom. Zuverlässig und effizient, geringe Instabilität. Braucht Strom und eine Verbindung zu einem Flux-Node. Speichert keinen Flux.
block.flux-protocol-flux-accelerator.name = Flux-Beschleuniger (Erzeuger)
block.flux-protocol-flux-accelerator.description = ERZEUGT Flux aus normalem Strom. Höherer Durchsatz, aber die Instabilität steigt viel schneller. Braucht Strom und einen Flux-Node.
block.flux-protocol-flux-quantum.name = Quantenkonverter (Erzeuger)
block.flux-protocol-flux-quantum.description = ERZEUGT Flux aus normalem Strom. High-End-Durchsatz, teuer und riskant. Braucht Strom und einen Flux-Node.
block.flux-protocol-skillable-turret.name = Skillable Turret
block.flux-protocol-skillable-turret.description = VERBRAUCHT Flux (am besten) oder – schwächer – normalen Strom, nie beides gleichzeitig. Ein Material-Slot bestimmt den Modus. Flux: volle Reichweite, Feuerrate und Schaden. Normalstrom: braucht extrem viel Strom für nur ca. 30 % Feuerrate, 60 % Reichweite und 45 % Schaden; die drei High-End-Modi gehen nur mit Flux. Aufbau: Strom → Flux-Konverter → Flux-Node → Turm.
block.flux-protocol-flux-node-erekir.name = Flux-Node (Verteiler)
block.flux-protocol-flux-node-erekir.description = VERTEILT Flux, erzeugt keinen. Verbindet Konverter (Flux-Erzeuger) mit Verbrauchern wie dem Skillable Turret. Beim Platzieren verbindet er alles in Reichweite automatisch; bei ausgewähltem Node ein Gebäude antippen, um es zu verbinden oder zu trennen.
